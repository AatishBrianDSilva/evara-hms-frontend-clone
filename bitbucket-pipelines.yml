image: node:latest

pipelines:
  default:
    - step:
        name: Build and Deploy
        script:
          - npm install
          - npm run build
          - pipe: atlassian/aws-s3-deploy:1.1.1
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION: 'ap-south-1'
              S3_BUCKET: $S3_BUCKET_NAME
              LOCAL_PATH: 'dist' 
              DELETE_FLAG: 'true'
